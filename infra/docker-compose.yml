# Local infrastructure for poc_gibberlink.
#
#   docker compose -f infra/docker-compose.yml up -d qdrant                 # default: Qdrant only
#   docker compose -f infra/docker-compose.yml --profile full up -d --build # Qdrant + backend + frontend
#   docker compose -f infra/docker-compose.yml --profile websearch up -d searxng     # opt-in: live web search
#   docker compose -f infra/docker-compose.yml --profile websearch rm -sf searxng    # stop + remove it only
#
# Default (development on macOS): only Qdrant runs in Docker. Docker on macOS has no Metal GPU access,
# so Ollama, the backend and the ML models run natively on the host.
#
# Profile "full": backend and frontend in containers too (config/docker.config.json: CPU devices,
# faster-whisper). Ollama stays on the host and is reached at host.docker.internal; on Linux, start it
# with OLLAMA_HOST=0.0.0.0 so the container can reach it. Don't run the native backend/frontend at the
# same time: they use the same ports. The backend image has the `ml` dependency group (CPU-only PyTorch)
# but no model weights: run scripts/setup/download_models.sh first; ../data (with data/models) is mounted.
#
# MEMORY, profile "full". Models run on the CPU and the backend preloads all of them at startup:
#
#   BGE-M3 embedder              ~2.3 GB
#   bge-reranker-v2-m3           ~2.3 GB
#   Python, torch, FastAPI       ~0.7 GB    measured: the ML libraries alone are ~0.55 GB resident
#   Kokoro-82M                   ~0.55 GB   docs/DESIGN.md §9; with the process it did not fit in an 800 MB container
#   faster-whisper small, int8   ~0.4 GB    measured (0.65 GB while loading)
#   Silero VAD                   ~0.05 GB
#   Docling layout/table/OCR     ~1.7 GB    peak, only while a document is being ingested
#
#   Backend: ~6.5 GB steady, ~8 GB while a document is ingested. Qdrant ~0.3 GB (capped at 1 GB), frontend ~0.15 GB.
#   Ollama (qwen3:4b-instruct, ~3 GB) is a host process and comes on top. Give Docker at least 10 GB.
#
#   A Docker Desktop VM capped at 1.5 GB, as on this project's Mac (only Qdrant fits), cannot run this profile: the
#   models fail to load, and the VM's out-of-memory killer may end any process in it, Qdrant included. On a 16 GB Mac
#   run the backend and frontend natively (README.md, "Run"): that needs less and uses the Apple GPU (MPS,
#   mlx-whisper), which containers cannot. This profile is for Linux servers and larger machines.
#   `docker compose ... --profile full config` shows the effective limits; BACKEND_MEM_LIMIT changes the backend's.
#   Docker Desktop's own memory setting (Settings > Resources) is yours to change; nothing here touches it.
#
# Profile "websearch" (opt-in, docs/DESIGN.md §3.7): SearXNG on 127.0.0.1:8888 for the live-data tool. It
# forwards search queries to public engines, so the backend uses it only with tools.web_search.enabled and
# "web_search" in strict_offline_exceptions (config/README.md). Set SEARXNG_SECRET to fix its secret; unset,
# a random one is generated at each start. To stop it, name the service (`rm -sf searxng` or `stop searxng`):
# `down` acts on the whole project, so `--profile websearch down` would also remove the Qdrant container.

name: poc_gibberlink

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.2}
    container_name: gibberlink-qdrant
    ports:
      # Bound to loopback only; never exposed to the network.
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - ../data/qdrant:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  searxng:
    profiles: [websearch]
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.9.23-3cd69d30e}
    container_name: gibberlink-searxng
    ports:
      - "127.0.0.1:8888:8080" # loopback only
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      # Passed through from the host; empty → a random secret per start (the shell below; $$ escapes compose).
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export SEARXNG_SECRET="$${SEARXNG_SECRET:-$$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9)}" &&
        exec /usr/local/searxng/entrypoint.sh
    mem_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    image: voice-agent-backend:local
    container_name: gibberlink-backend
    environment:
      APP_CONFIG_FILE: config/docker.config.json
    # A ceiling, not a reservation: it keeps a runaway ingestion from taking the whole host (see MEMORY above).
    # No swap beyond it, so hitting it kills the backend (restart: unless-stopped brings it back) instead of thrashing.
    mem_limit: ${BACKEND_MEM_LIMIT:-10g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-10g}
    stop_grace_period: 30s # at shutdown the app waits up to 10 s for answers still being saved
    volumes:
      - ../data:/app/data # models, uploads, SQLite; never baked into the image
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; built in on Docker Desktop
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    image: voice-agent-frontend:local
    container_name: gibberlink-frontend
    environment:
      BACKEND_URL: http://localhost:8000 # as seen from the browser
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
