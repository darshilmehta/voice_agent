# Alembic CLI config (uv run alembic …, from backend/). The database URL is not set here: env.py reads it from the
# app config (APP_CONFIG_FILE, default ../config/local.config.json; METADATA_DB__URL overrides it). The app itself
# migrates programmatically at startup (app/db/migrate.py) and does not read this file.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# 0001_initial.py, 0002_add_something.py: pass --rev-id 0002 to `alembic revision`
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix-only --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
