[project]
name = "voice-agent-backend"
version = "0.1.0"
description = "Local document voice agent: backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.50",
  "pydantic>=2.10",
  "httpx>=0.28",
  "aiosqlite>=0.22.1",
  "alembic>=1.20.0",
  "qdrant-client>=1.12",
  "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16",
]
# Local models for ingestion and retrieval (docs/DESIGN.md §3.1-3.2). Optional: `uv sync --group ml`.
# The app, /health and CI run without it; code imports these lazily and reports their absence.
ml = [
  "docling>=2.50",
  "flagembedding>=1.3",
  "onnxruntime>=1.30.0",
  "opencv-python-headless>=5.0.0.93",  # see override-dependencies below
  "rapidocr>=3.9.1,<3.10",  # 3.10 dropped PP_OCRV6_LANGS, which docling needs (§9.4)
  "sentence-transformers>=3.3",
  "torch>=2.14.1",
  "transformers>=4.45",  # older releases make uv backtrack to a 2021 version that needs Rust (§9.3)
]

[tool.uv]
# docling depends on opencv-python-headless and rapidocr on opencv-python; both install into the
# same cv2/ directory and removing either deletes it (docs/DESIGN.md §9.6). Keep only the headless build.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the real models (ml group) and a running Qdrant; skipped unless RUN_INTEGRATION=1",
]
filterwarnings = [
  # FastAPI's TestClient still uses httpx; harmless for tests
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
