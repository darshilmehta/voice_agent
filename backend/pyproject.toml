[project]
name = "voice-agent-backend"
version = "0.1.0"
description = "Local document voice agent: backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.50",
  "pydantic>=2.10",
  "httpx>=0.28",
  "aiosqlite>=0.22.1",
  "alembic>=1.20.0",
  "qdrant-client>=1.12",
  "sqlalchemy[asyncio]>=2.1.4",
  "python-multipart>=0.0.20",
  "numpy>=2.0",  # PCM audio buffers in the voice session (already pulled in by qdrant-client)
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16",
]
# Local models for ingestion, retrieval and speech (docs/DESIGN.md §3.1-3.3). Optional: `uv sync --group ml`.
# The app, /health and CI run without it; code imports these lazily and reports their absence.
ml = [
  "docling>=2.50",
  # spaCy's English model for Kokoro's G2P (misaki), bundled so nothing is downloaded at runtime (§9.3)
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "faster-whisper>=1.1",  # STT on Linux/CUDA (CPU-only on a Mac, §2)
  "flagembedding>=1.3",
  "kokoro>=0.9.4",
  "misaki[en]>=0.9.4",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",  # STT on Apple Silicon (§9.3)
  "onnxruntime>=1.30.0",
  "opencv-python-headless>=5.0.0.93",  # see override-dependencies below
  "rapidocr>=3.9.1,<3.10",  # 3.10 dropped PP_OCRV6_LANGS, which docling needs (§9.4)
  "sentence-transformers>=3.3",
  "silero-vad>=5.1",  # server-side VAD; the model ships inside the package
  "soundfile>=0.12",
  "torch>=2.14.1",
  "torchvision>=0.29.1",  # docling's layout model needs it; direct, so it takes torch's CPU source below
  "transformers>=4.45",  # older releases make uv backtrack to a 2021 version that needs Rust (§9.3)
]

[tool.uv]
# docling depends on opencv-python-headless and rapidocr on opencv-python; both install into the
# same cv2/ directory and removing either deletes it (docs/DESIGN.md §9.6). Keep only the headless build.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
# On Linux, PyPI's torch depends on several GB of CUDA libraries (nvidia-*, cuda-toolkit, triton) that a CPU-only
# container (infra/docker, docs/DESIGN.md §2) never uses. Take torch and torchvision from PyTorch's CPU index there.
# macOS (MPS) and Windows keep PyPI's wheels, which are Metal / CPU builds already. On a CUDA host, delete these two
# lines and run `uv lock`. uv applies `sources` to direct dependencies only, hence torchvision in the ml group.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # used only by the sources above; every other package still comes from PyPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the real models (ml group) and a running Qdrant; skipped unless RUN_INTEGRATION=1",
]
filterwarnings = [
  # FastAPI's TestClient still uses httpx; harmless for tests
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
